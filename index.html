<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Clicker</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-background-color, #1f1f1f);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .score-container {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .coin {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 -5px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.05s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .coin:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="score-container">Монеты: <span id="score">0</span></div>
    <div class="coin" id="clickBtn">🪙</div>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем приложение на весь экран

        let score = 0;
        const scoreEl = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');

        // Загружаем сохраненный счет (если есть)
        if (localStorage.getItem('clicker_score')) {
            score = parseInt(localStorage.getItem('clicker_score'));
            scoreEl.textContent = score;
        }

        // Обработчик клика
        clickBtn.addEventListener('click', () => {
            score++;
            scoreEl.textContent = score;
            localStorage.setItem('clicker_score', score);
            
            // Легкая вибрация на смартфонах при клике
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>
</body>
</html>

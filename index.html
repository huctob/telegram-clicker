<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bunny Merge 🐰</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap');

        :root {
            --bg: #09090e; 
            --panel: #141522; 
            --panel-light: #1c1e30;
            --border: #2a2d45;
            --gold: #f1c40f; 
            --green: #00e676; 
            --text: #ffffff; 
            --dim: #8c90a8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; height: 100vh; overflow: hidden; 
            background: var(--bg); color: var(--text); 
            font-family: 'Montserrat', sans-serif; user-select: none; 
            display: flex; flex-direction: column; 
        }

        .bg-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 10%, rgba(241, 196, 15, 0.1) 0%, transparent 50%); z-index: -1; pointer-events: none; }

        /* Верхняя панель */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(20, 21, 34, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 10; }
        .balance-box { display: flex; flex-direction: column; gap: 4px; }
        .val-box { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 20px; color: var(--gold); text-shadow: 0 0 10px rgba(241, 196, 15, 0.4); }
        .val-box span { font-size: 24px; }
        .per-sec { font-size: 12px; color: var(--green); font-weight: 700; margin-left: 30px; }
        
        .level-box { background: var(--panel-light); border: 1px solid var(--border); padding: 6px 12px; border-radius: 12px; font-weight: 900; font-size: 14px; }
        .level-box span { color: var(--gold); }

        /* Экраны */
        .screen { display: none; flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 90px; flex-direction: column; align-items: center; position: relative; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { margin: 0 0 10px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }

        /* Поле для слияния (Merge) */
        .merge-board { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            width: 100%; 
            max-width: 340px; 
            background: var(--panel); 
            padding: 10px; 
            border-radius: 20px; 
            border: 1px solid var(--border);
            margin-top: 15px;
        }
        .cell { 
            background: var(--panel-light); 
            border-radius: 16px; 
            aspect-ratio: 1; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border: 2px solid transparent;
            transition: 0.1s;
            position: relative;
        }
        .cell:active { transform: scale(0.92); }
        .cell.selected { border-color: var(--green); background: rgba(0, 230, 118, 0.1); box-shadow: 0 0 15px rgba(0, 230, 118, 0.3); }
        .cell.empty { background: rgba(255,255,255,0.02); cursor: default; border: 1px dashed var(--border); }
        
        .cell-icon { font-size: 40px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        .cell-lvl { position: absolute; bottom: 4px; right: 6px; font-size: 12px; font-weight: 900; color: var(--dim); background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 6px; }

        /* Кнопки */
        .btn { background: linear-gradient(135deg, var(--green), #00b248); border: none; color: #000; font-weight: 900; padding: 12px 16px; border-radius: 12px; cursor: pointer; font-size: 14px; transition: 0.2s; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3); width: 100%; margin-top: 15px;}
        .btn:active { transform: scale(0.95); }
        .btn-gold { background: linear-gradient(135deg, #ffd700, #f1c40f); color: #000; box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3); }

        /* Инвентарь/Бусты */
        .grid { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
        .item { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 14px; }
        .item-icon { font-size: 32px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 12px; }
        .item-info { flex: 1; }
        .item-name { font-weight: 900; font-size: 15px; }
        .item-desc { font-size: 11px; color: var(--dim); margin-top: 2px; }

        /* Навигация */
        .nav { position: fixed; bottom: 0; width: 100%; height: 72px; background: rgba(20, 21, 34, 0.95); backdrop-filter: blur(15px); border-top: 1px solid var(--border); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--dim); cursor: pointer; gap: 4px; font-weight: 700; transition: 0.2s; }
        .nav-item.active { color: var(--gold); text-shadow: 0 0 10px rgba(241,196,15,0.5); }
        .nav-item.active .nav-icon { transform: scale(1.2); filter: drop-shadow(0 0 8px var(--gold)); }
        .nav-icon { font-size: 22px; transition: 0.2s; }

        /* Рефералка */
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; text-align: center; }
        .ref-link { background: #000; padding: 12px; border-radius: 12px; word-break: break-all; font-family: monospace; font-size: 13px; color: var(--blue); margin: 15px 0; border: 1px solid #333; text-align: center; }

        /* Модалка и Тосты */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: linear-gradient(to bottom, var(--panel-light), var(--panel)); border: 2px solid var(--gold); padding: 30px 20px; border-radius: 24px; text-align: center; width: 100%; max-width: 320px; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(20, 21, 34, 0.95); border-left: 4px solid var(--gold); padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 13px; z-index: 600; box-shadow: 0 5px 20px rgba(0,0,0,0.5); animation: slide 0.3s; }
        @keyframes slide { 0% { top: -50px; } 100% { top: 20px; } }

        .float-coin { position: fixed; font-weight: 900; font-size: 24px; color: var(--gold); pointer-events: none; z-index: 50; text-shadow: 0 2px 10px rgba(0,0,0,0.8); animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(1); opacity: 1; } 100% { transform: translate(-50%, -80px) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<!-- Хедер -->
<div class="header">
    <div class="balance-box">
        <div class="val-box"><span>🪙</span> <div id="ui-coins">0</div></div>
        <div class="per-sec" id="ui-per-sec">+0 / сек</div>
    </div>
    <div class="level-box">LVL <span id="ui-lvl">1</span></div>
</div>

<!-- 1. ЭКРАН СЛИЯНИЯ (ГЛАВНАЯ) -->
<div class="screen active" id="screen-merge">
    <h2>Слияние кроликов</h2>
    <p style="font-size:12px; color:var(--dim); text-align:center;">Нажми на двух одинаковых кроликов, чтобы объединить их</p>
    
    <div class="merge-board" id="merge-board">
        <!-- Ячейки генерируются в JS -->
    </div>

    <button class="btn btn-gold" id="buy-bunny-btn" onclick="buyNewBunny()">Купить кролика 1 ур. (Цена: <span id="bunny-cost">50</span> 🪙)</button>
</div>

<!-- 2. ЭКРАН БУСТОВ -->
<div class="screen" id="screen-shop">
    <h2>Улучшения</h2>
    <div class="grid" id="shop-list"></div>
</div>

<!-- 3. ЭКРАН ДРУЗЬЯ -->
<div class="screen" id="screen-ref">
    <h2>Друзья</h2>
    <div class="card">
        <div style="font-size:50px; margin-bottom:10px;">🤝</div>
        <div style="font-weight:900; font-size:16px; margin-bottom:8px;">Зови друзей!</div>
        <div style="font-size:12px; color:var(--dim); margin-bottom:15px;">Получай 10% от пассивного дохода друзей.</div>
        <div class="ref-link" id="ref-link">Загрузка...</div>
        <button class="btn btn-gold" onclick="copyRef()">СКОПИРОВАТЬ</button>
        
        <div style="display:flex; justify-content:space-around; border-top:1px solid var(--border); padding-top:15px; margin-top:15px;">
            <div>
                <div style="font-size:20px; font-weight:900; color:var(--gold);" id="prof-refs">0</div>
                <div style="font-size:11px; color:var(--dim);">Друзей</div>
            </div>
            <div>
                <div style="font-size:20px; font-weight:900; color:var(--green);" id="prof-earned">0</div>
                <div style="font-size:11px; color:var(--dim);">Заработано</div>
            </div>
        </div>
    </div>
</div>

<!-- Навигация -->
<div class="nav">
    <div class="nav-item active" data-tab="merge"><div class="nav-icon">🐰</div>Слияние</div>
    <div class="nav-item" data-tab="shop"><div class="nav-icon">🛒</div>Бусты</div>
    <div class="nav-item" data-tab="ref"><div class="nav-icon">🤝</div>Друзья</div>
</div>

<script>
// ==========================================
// 1. TELEGRAM INIT & РЕФЕРАЛКА
// ==========================================
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

var TG_USER = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
var USER_ID = TG_USER ? TG_USER.id : 'guest_' + Math.floor(Math.random()*999999);

var startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ? tg.initDataUnsafe.start_param : null;
if (startParam && startParam.startsWith('ref_')) {
    var referrerId = startParam.replace('ref_', '');
    if (referrerId !== String(USER_ID) && !localStorage.getItem('b_referrer')) {
        localStorage.setItem('b_referrer', referrerId);
    }
}

// --- СОСТОЯНИЕ ---
const S = {
    coins: parseFloat(localStorage.getItem('b_coins')) || 100,
    lvl: parseInt(localStorage.getItem('b_lvl')) || 1,
    // Массив из 9 ячеек. null = пусто, число = уровень кролика
    board: JSON.parse(localStorage.getItem('b_board')) || [1, 1, 1, null, null, null, null, null, null],
    buyCost: parseInt(localStorage.getItem('b_buy_cost')) || 50,
    refs: parseInt(localStorage.getItem('b_refs')) || 0,
    refEarned: parseFloat(localStorage.getItem('b_ref_earned')) || 0
};

function save() {
    localStorage.setItem('b_coins', S.coins);
    localStorage.setItem('b_lvl', S.lvl);
    localStorage.setItem('b_board', JSON.stringify(S.board));
    localStorage.setItem('b_buy_cost', S.buyCost);
    localStorage.setItem('b_refs', S.refs);
    localStorage.setItem('b_ref_earned', S.refEarned);
}

// --- ЛОГИКА КРОЛИКОВ ---
const BUNNY_EMOJIS = ['🐰', '🐇', '🐿️', '🦊', '🐻', '🐼', '🦁', '🐯', '🦄', '🐉', '👑'];

// Пассивный доход за 1 секунду от одного кролика (зависит от уровня)
function getIncomeForLevel(lvl) {
    if (lvl === 1) return 0.1;
    if (lvl === 2) return 0.5;
    if (lvl === 3) return 2;
    if (lvl === 4) return 10;
    if (lvl === 5) return 50;
    return lvl * 100; // Высокие уровни дают много
}

// Общий доход в секунду
function getTotalIncome() {
    let total = 0;
    S.board.forEach(lvl => {
        if (lvl) total += getIncomeForLevel(lvl);
    });
    return total;
}

// --- ОТРИСОВКА ---
function renderBoard() {
    const boardEl = document.getElementById('merge-board');
    boardEl.innerHTML = '';
    
    S.board.forEach((lvl, index) => {
        const cell = document.createElement('div');
        if (lvl) {
            cell.className = 'cell';
            cell.innerHTML = `
                <div class="cell-icon">${BUNNY_EMOJIS[lvl-1] || '👑'}</div>
                <div class="cell-lvl">Ур. ${lvl}</div>
            `;
            cell.onclick = () => handleCellClick(index);
        } else {
            cell.className = 'cell empty';
        }
        boardEl.appendChild(cell);
    });
}

let selectedIndex = -1;

function handleCellClick(index) {
    const lvl = S.board[index];
    
    if (selectedIndex === -1) {
        // Первый клик
        selectedIndex = index;
        document.querySelectorAll('.cell')[index].classList.add('selected');
    } else if (selectedIndex === index) {
        // Отмена выбора
        selectedIndex = -1;
        document.querySelectorAll('.cell')[index].classList.remove('selected');
    } else {
        // Второй клик
        const firstLvl = S.board[selectedIndex];
        
        if (firstLvl === lvl) {
            // Слияние!
            S.board[selectedIndex] = null;
            S.board[index] = lvl + 1;
            
            // Проверка на повышение общего уровня игрока (опционально)
            if (lvl + 1 > S.lvl) S.lvl = lvl + 1;
            
            selectedIndex = -1;
            save(); updateUI();
            toast('Кролики слились! Получен Ур. ' + (lvl+1));
        } else {
            // Разные уровни, переключаем выбор
            document.querySelectorAll('.cell')[selectedIndex].classList.remove('selected');
            selectedIndex = index;
            document.querySelectorAll('.cell')[index].classList.add('selected');
        }
    }
}

function buyNewBunny() {
    if (S.coins < S.buyCost) return toast('Недостаточно монет!');
    
    const emptyIndex = S.board.indexOf(null);
    if (emptyIndex === -1) return toast('Нет свободных мест на поле!');
    
    S.coins -= S.buyCost;
    S.board[emptyIndex] = 1;
    // Цена растет с каждой покупкой
    S.buyCost = Math.floor(S.buyCost * 1.2);
    
    save(); updateUI();
    toast('Куплен новый кролик!');
}

// --- ОБНОВЛЕНИЕ UI ---
function updateUI() {
    document.getElementById('ui-coins').innerText = Math.floor(S.coins).toLocaleString();
    document.getElementById('ui-lvl').innerText = S.lvl;
    
    const income = getTotalIncome();
    document.getElementById('ui-per-sec').innerText = '+' + income.toFixed(1) + ' / сек';
    
    document.getElementById('bunny-cost').innerText = S.buyCost.toLocaleString();
    if (S.coins < S.buyCost) {
        document.getElementById('buy-bunny-btn').disabled = true;
        document.getElementById('buy-bunny-btn').style.opacity = '0.5';
    } else {
        document.getElementById('buy-bunny-btn').disabled = false;
        document.getElementById('buy-bunny-btn').style.opacity = '1';
    }
    
    document.getElementById('ref-link').innerText = `t.me/HuctobClickerBot?start=ref_${USER_ID}`;
    document.getElementById('prof-refs').innerText = S.refs;
    document.getElementById('prof-earned').innerText = Math.floor(S.refEarned);

    renderBoard();
}

// --- ТАЙМЕР ДОХОДА (КАЖДУЮ СЕКУНДУ) ---
setInterval(() => {
    const income = getTotalIncome();
    if (income > 0) {
        S.coins += income;
        save();
        // Обновляем только цифры, чтобы не дергалась доска
        document.getElementById('ui-coins').innerText = Math.floor(S.coins).toLocaleString();
        
        // Начисление рефереру (10%)
        var referrer = localStorage.getItem('b_referrer');
        if (referrer && referrer !== 'guest' && referrer !== String(USER_ID)) {
            var rKey = 'b_owed_' + referrer;
            var rOwed = parseFloat(localStorage.getItem(rKey) || 0);
            rOwed += income * 0.1;
            localStorage.setItem(rKey, rOwed);
        }
    }
}, 1000);

// --- УТИЛИТЫ ---
function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
}

function copyRef() {
    const text = document.getElementById('ref-link').innerText;
    navigator.clipboard.writeText(text).then(() => toast('Ссылка скопирована!'));
}

// --- НАВИГАЦИЯ ---
document.querySelectorAll('.nav-item').forEach(tab => {
    tab.onclick = function() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
        document.getElementById('screen-' + this.dataset.tab).classList.add('active');
        this.classList.add('active');
    };
});

// --- СБОР РЕФ-БОНУСОВ ПРИ ВХОДЕ ---
(function() {
    var key = 'b_owed_' + USER_ID;
    var owed = parseFloat(localStorage.getItem(key) || 0);
    if (owed > 0) {
        S.coins += owed; S.refEarned += owed;
        localStorage.setItem('b_ref_earned', S.refEarned);
        localStorage.removeItem(key);
        save();
        setTimeout(() => toast('+' + Math.floor(owed) + ' 🪙 от рефералов!'), 1000);
    }
})();

// Запуск
updateUI();
</script>
</body>
</html>

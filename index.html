<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кликер</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #coins-text {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Стиль монетки */
        .coin {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ffdf00 0%, #d4af37 100%);
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 -8px 0 #b8860b, inset 0 8px 0 #fff79a;
            cursor: pointer;
            transition: transform 0.05s ease; /* Очень быстрый возврат формы */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 8px solid #b8860b;
        }

        /* Знак внутри монетки */
        .coin::after {
            content: "🪙";
            font-size: 90px;
        }

        /* Эффект сжатия при самом клике */
        .coin:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div id="coins-text">Монеты: 0</div>
    
    <!-- Монетка с привязанной функцией клика -->
    <div class="coin" onclick="clickCoin()"></div>

    <script>
        // 1. Загружаем монеты из памяти браузера при старте
        let coins = localStorage.getItem('coins') ? parseInt(localStorage.getItem('coins')) : 0;
        
        // Отображаем сохраненные монеты на экране
        const scoreDisplay = document.getElementById('coins-text');
        scoreDisplay.innerText = `Монеты: ${coins}`;

        // 2. Функция самого клика
        function clickCoin() {
            coins++;
            scoreDisplay.innerText = `Монеты: ${coins}`;
            
            // Сохраняем новое значение в память
            localStorage.setItem('coins', coins);
        }
    </script>

</body>
</html>

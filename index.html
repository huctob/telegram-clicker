<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clicker App</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial; margin: 0; text-align: center; height: 100vh; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding-bottom: 70px; }
        .screen.active { display: flex; }
        
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #191919; border-top: 2px solid #333; display: flex; }
        .nav-item { flex: 1; background: none; border: none; color: #888; font-size: 16px; cursor: pointer; }
        .nav-item.active { color: #f5b041; font-weight: bold; }
        
        #coins-text { font-size: 40px; margin-bottom: 30px; }
        .coin { width: 200px; height: 200px; background: #f5b041; border-radius: 50%; box-shadow: 0 10px 0 #935116; display: flex; align-items: center; justify-content: center; font-size: 70px; cursor: pointer; margin: 0 auto; }
        .coin:active { transform: translateY(5px); box-shadow: 0 5px 0 #935116; }
        
        /* КАРТОЧКИ ПРИЗОВ */
        .prize-preview { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
        .prize-badge { padding: 5px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        
        .wheel-box { position: relative; margin: 20px auto; width: 250px; }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #ff3333; z-index: 10; }
        .wheel { width: 250px; height: 250px; border-radius: 50%; border: 6px solid #333; background: conic-gradient(#e74c3c 0deg 90deg, #3498db 90deg 180deg, #2ecc71 180deg 270deg, #f1c40f 270deg 360deg); transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        
        .btn-spin { background: #2ecc71; color: #fff; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 20px; cursor: pointer; margin-top: 15px; }
        .btn-spin:disabled { background: #555; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: КЛИКЕР -->
    <div id="screen-clicker" class="screen active">
        <div id="coins-text">Монеты: 0</div>
        <div class="coin" id="coin-btn">⭐</div>
    </div>

    <!-- ЭКРАН 2: РУЛЕТКА -->
    <div id="screen-roulette" class="screen">
        <h2>Колесо Удачи</h2>
        
        <!-- Плашки с призами -->
        <div class="prize-preview">
            <span class="prize-badge" style="background:#e74c3c;">🔴 +500 / Беспл</span>
            <span class="prize-badge" style="background:#3498db;">🔵 x2 / Буст</span>
            <span class="prize-badge" style="background:#2ecc71;">🟢 +2500 / Звёзды</span>
            <span class="prize-badge" style="background:#f1c40f;">🟡 Скин 👑</span>
        </div>

        <div class="wheel-box">
            <div class="pointer"></div>
            <div class="wheel" id="wheel-element"></div>
        </div>

        <button class="btn-spin" id="spin-free" onclick="startSpin()">Бесплатно</button>
        
        <!-- Кнопка прокрутки за звезды -->
        <button class="btn-spin" id="spin-stars" onclick="startStarsSpin()" style="background: linear-gradient(135deg, #0088cc, #005580); margin-top: 10px;">
            Крутить за ⭐ 5 Звезд
        </button>

        <div id="timer-box" style="margin-top: 10px; font-size: 14px; color: #888;"></div>
    </div>

    <!-- МЕНЮ -->
    <div class="nav-bar">
        <button id="tab-clicker" class="nav-item active" onclick="goTab('clicker')">🎯 Кликер</button>
        <button id="tab-roulette" class="nav-item" onclick="goTab('roulette')">🎡 Рулетка</button>
    </div>

    <script>
        let coins = parseInt(localStorage.getItem('coins')) || 0;
        let activeSkin = localStorage.getItem('activeSkin') || '⭐';
        let clickMultiplier = 1;
        let spinning = false;

        const scoreView = document.getElementById('coins-text');
        const coinBtn = document.getElementById('coin-btn');
        const wheelEl = document.getElementById('wheel-element');

        scoreView.innerText = 'Монеты: ' + coins;
        coinBtn.innerText = activeSkin;

        function goTab(name) {
            if (spinning) return;
            document.getElementById('screen-clicker').classList.remove('active');
            document.getElementById('screen-roulette').classList.remove('active');
            document.getElementById('tab-clicker').classList.remove('active');
            document.getElementById('tab-roulette').classList.remove('active');

            if (name === 'clicker') {
                document.getElementById('screen-clicker').classList.add('active');
                document.getElementById('tab-clicker').classList.add('active');
                scoreView.innerText = 'Монеты: ' + coins;
            } else {
                document.getElementById('screen-roulette').classList.add('active');
                document.getElementById('tab-roulette').classList.add('active');
                checkTimer();
            }
        }

        function handleTap(e) {
            coins += (1 * clickMultiplier);
            scoreView.innerText = 'Монеты: ' + coins;
            localStorage.setItem('coins', coins);
        }

        coinBtn.addEventListener('mousedown', handleTap);
        coinBtn.addEventListener('touchstart', function(e) { e.preventDefault(); handleTap(e); }, { passive: false });

        // ОБЫЧНЫЙ БЕСПЛАТНЫЙ СПИН
        function startSpin() {
            if (spinning) return;
            spinning = true;
            document.getElementById('spin-free').disabled = true;
            document.getElementById('spin-stars').disabled = true;
            
            let degrees = Math.floor(Math.random() * 360) + 1800;
            wheelEl.style.transform = 'rotate(' + degrees + 'deg)';

            setTimeout(function() {
                spinning = false;
                document.getElementById('spin-stars').disabled = false;
                let sector = (360 - (degrees % 360)) % 360;

                if (sector >= 0 && sector < 90) { 
                    coins += 500; 
                    alert("Бесплатный приз: Вы выиграли 500 монет!"); 
                } else if (sector >= 90 && sector < 180) { 
                    activeSkin = '👑'; 
                    localStorage.setItem('activeSkin', '👑'); 
                    coinBtn.innerText = '👑'; 
                    alert("Выпал скин Короны 👑!"); 
                } else if (sector >= 180 && sector < 270) { 
                    coins += 2500; 
                    alert("Бесплатный приз: Вы выиграли 2500 монет!"); 
                } else { 
                    clickMultiplier = 2; 
                    alert("Буст x2 начисление активирован на 3 минуты!"); 
                    setTimeout(() => clickMultiplier = 1, 180000); 
                }

                localStorage.setItem('coins', coins);
                localStorage.setItem('spinCooldowTime', Date.now() + 86400000);
                checkTimer();
            }, 4100);
        }

        // НОВАЯ ФУНКЦИЯ ДЛЯ ЗВЕЗДНОЙ РУЛЕТКИ
        function startStarsSpin() {
            if (spinning) return;
            
            let payConfirm = confirm("Купить платную прокрутку за ⭐ 5 Звезд Telegram?");
            if (!payConfirm) return;

            spinning = true;
            document.getElementById('spin-stars').disabled = true;
            document.getElementById('spin-free').disabled = true;
            
            let degrees = Math.floor(Math.random() * 360) + 1800;
            wheelEl.style.transform = 'rotate(' + degrees + 'deg)';

            setTimeout(function() {
                spinning = false;
                document.getElementById('spin-stars').disabled = false;
                let sector = (360 - (degrees % 360)) % 360;

                if (sector >= 0 && sector < 90) { 
                    coins += 5000; 
                    alert("🔥 ЗВЕЗДНЫЙ ПРИЗ! Вы выиграли +5,000 монет!"); 
                } else if (sector >= 90 && sector < 180) { 
                    activeSkin = '👑'; 
                    localStorage.setItem('activeSkin', '👑'); 
                    coinBtn.innerText = '👑'; 
                    alert("Выпал скин Короны 👑!"); 
                } else if (sector >= 180 && sector < 270) { 
                    coins += 15000; 
                    alert("💎 МЕГА-КУШ! Вы выиграли +15,000 монет!"); 
                } else { 
                    clickMultiplier = 5; 
                    alert("💥 СУПЕР БУСТ! Клик дает x5 монет на 5 минут!"); 
                    setTimeout(() => clickMultiplier = 1, 300000); 
                }

                localStorage.setItem('coins', coins);
                checkTimer();
            }, 4100);
        }

        function checkTimer() {
            const btn = document.getElementById('spin-free');
            const timerBox = document.getElementById('timer-box');
            let cooldown = parseInt(localStorage.getItem('spinCooldowTime')) || 0;

            if (spinning) return;

            if (Date.now() >= cooldown) {
                btn.disabled = false;
                timerBox.innerText = "Рулетка доступна!";
            } else {
                btn.disabled = true;
                let rest = cooldown - Date.now();
                let h = Math.floor(rest / 3600000);
                let m = Math.floor((rest % 3600000) / 60000);
                let s = Math.floor((rest % 60000) / 1000);
                timerBox.innerText = "Доступно через: " + h + "ч " + m + "м " + s + "с";
                setTimeout(checkTimer, 1000);
            }
        }
    </script>
</body>
</html>
